// =====================================================
// BUILD HIERARCHY for d3.tree()
// =====================================================

// Choose primary parent for each node (lowest-stage source, then lowest id)
const nodeMap = {};
NODES.forEach(n => nodeMap[n.id] = n);

// Build adjacency: for each node, find all parents
const parents = {};
EDGES.forEach(e => {
  if (!parents[e.target]) parents[e.target] = [];
  parents[e.target].push(e.source);
});

// Choose primary parent
const primaryParent = {};
NODES.forEach(n => {
  if (n.id === 1) return; // root
  const pList = parents[n.id] || [];
  if (pList.length === 0) {
    // Orphan — attach to spectral action or nearest stage
    primaryParent[n.id] = n.stage <= 3 ? 1 : n.stage <= 7 ? 5 : 26;
    return;
  }
  // Pick parent with lowest stage, then lowest id
  pList.sort((a, b) => {
    const sa = nodeMap[a].stage, sb = nodeMap[b].stage;
    return sa !== sb ? sa - sb : a - b;
  });
  primaryParent[n.id] = pList[0];
});

// Build tree structure
function buildHierarchy() {
  const root = {...nodeMap[1], children: []};
  const treeNodes = {1: root};

  // Process in order of stage then id
  const sorted = NODES.filter(n => n.id !== 1).slice().sort((a, b) => a.stage !== b.stage ? a.stage - b.stage : a.id - b.id);

  sorted.forEach(n => {
    const node = {...n, children: []};
    treeNodes[n.id] = node;
    const pid = primaryParent[n.id];
    if (treeNodes[pid]) {
      treeNodes[pid].children.push(node);
    } else {
      root.children.push(node);
    }
  });

  return root;
}

  .join("g")
  .attr("transform", d => `translate(${d.x},${d.y})`)
  .style("cursor", "pointer")
  .on("click", (e, d) => openPanel(d.data))
  .on("mouseover", (e, d) => showTooltip(e, d.data))
  .on("mousemove", moveTooltip)
  .on("mouseout", hideTooltip);

// Glow for starred
nodes.filter(d => d.data.starred)
  .append("circle")
  .attr("r", d => nodeRadius(d) + 5)
  .attr("fill", "none")
  .attr("stroke", "#38bdf8")
  .attr("stroke-width", 1.2)
  .attr("opacity", 0.4);

// Main circle
nodes.append("circle")
  .attr("r", d => nodeRadius(d))
  .attr("fill", d => STATUS_COLORS[d.data.status])
  .attr("opacity", 0.85)
  .attr("stroke", d => d.data.starred ? "#38bdf8" : "rgba(255,255,255,0.1)")
  .attr("stroke-width", d => d.data.starred ? 1.5 : 0.5);

// Label to the right of each node
nodes.append("text")
  .text(d => `${d.data.id}. ${d.data.short}`)
  .attr("x", d => nodeRadius(d) + 6)
  .attr("dy", 3.5)
  .attr("text-anchor", "start")
  .attr("fill", d => d.data.status === "predicted" ? "#a78bfa" : "#94a3b8")
  .attr("font-size", "8.5px")
  .attr("font-family", "'Inter', sans-serif")
  .attr("font-weight", d => d.data.starred ? 600 : 400);

// =====================================================
// TOOLTIP
// =====================================================

const tooltip = document.getElementById("tooltip");
function showTooltip(event, d) {
  tooltip.innerHTML = `<div class="tt-title">${d.id}. ${d.short}</div><div class="tt-stage">${d.stageName}</div><div style="margin-top:4px;font-size:0.72rem;color:#94a3b8">${d.evidence.length} file${d.evidence.length!==1?'s':''} · ${d.predictions.length} prediction${d.predictions.length!==1?'s':''}</div>`;
  tooltip.style.opacity = 1;
}
function moveTooltip(event) {
  tooltip.style.left = (event.clientX + 14) + "px";
  tooltip.style.top = (event.clientY - 10) + "px";
}
function hideTooltip() { tooltip.style.opacity = 0; }

// =====================================================
// DETAIL PANEL
// =====================================================

const panel = document.getElementById("detail-panel");
const detailContent = document.getElementById("detail-content");

function openPanel(d) {
  let evidenceHtml = "";
  if (d.evidence.length > 0) {
    evidenceHtml = `<h3>Evidence (Lean 4 files)</h3><table class="evidence-table"><thead><tr><th>File</th><th>Status</th><th>What it proves</th></tr></thead><tbody>${d.evidence.map(e => `<tr><td class="file-name">${e.file}</td><td><span class="status-badge ${e.status}">${e.status}</span></td><td>${e.what}</td></tr>`).join("")}</tbody></table>`;
  }
  let predHtml = d.predictions.map(p => `<div class="predicted-box"><div class="pred-label">Predicted / Open</div>${p}</div>`).join("");

  const deps = EDGES.filter(e => e.target === d.id).map(e => nodeMap[e.source]).filter(Boolean);
  const children = EDGES.filter(e => e.source === d.id).map(e => nodeMap[e.target]).filter(Boolean);
  let depsHtml = deps.length ? `<h3>Depends on</h3><div class="depends-list">${deps.map(dep => `<span class="dep-tag" onclick="openPanel(nodeMap[${dep.id}])">${dep.id}. ${dep.short}</span>`).join("")}</div>` : "";
  let childHtml = children.length ? `<h3>Enables</h3><div class="depends-list">${children.map(ch => `<span class="dep-tag" onclick="openPanel(nodeMap[${ch.id}])">${ch.id}. ${ch.short}</span>`).join("")}</div>` : "";

  const sc = STATUS_COLORS[d.status];
  detailContent.innerHTML = `<div class="node-id">Node ${d.id} · Stage ${d.stage}</div><h2>${d.name}</h2><span class="stage-tag" style="background:${sc}22;color:${sc};border:1px solid ${sc}44">${d.status} — ${d.stageName}</span><div class="description">${d.desc}</div>${evidenceHtml}${predHtml}${depsHtml}${childHtml}`;
  panel.classList.add("open");
}
function closePanel() { panel.classList.remove("open"); }

// =====================================================
// CONTROLS
// =====================================================

function resetView() {
  svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(margin.left, height/2 - yRange/2 - 40).scale(0.45));
  closePanel();
}

function expandAll() {
  const allX = root.descendants().map(d => d.x);
  const allYv = root.descendants().map(d => d.y);
  const xMin = d3.min(allX), xMax = d3.max(allX);
  const yMin = d3.min(allYv), yMax = d3.max(allYv);
  const scaleX = (width - 200) / (xMax - xMin + 200);
  const scaleY = (height - 140) / (yMax - yMin + 200);
  const scale = Math.min(scaleX, scaleY, 1);
  const tx = width/2 - (xMin + xMax)/2 * scale;
  const ty = height/2 - (yMin + yMax)/2 * scale;
  svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

// Pulse predicted
function pulse() {
  nodes.filter(d => d.data.status === "predicted")
    .select("circle:nth-child(2), circle:first-child")
    .transition().duration(1500).attr("opacity", 0.5)
    .transition().duration(1500).attr("opacity", 0.85);
  setTimeout(pulse, 3000);
}
pulse();

</script>
</body>
</html>
