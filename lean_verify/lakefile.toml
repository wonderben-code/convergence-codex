name = "LogosVerify"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LogosVerify"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.1"

[[lean_lib]]
name = "LogosVerify"

[[lean_lib]]
name = "PaperF"
srcDir = "paper_f"
roots = ["F4_1_Foundations", "F4_1b_DimensionAndArrow", "F4_1h_CauchyFunctionalEquation", "F4_1ij_QuaternionDivision", "F4_1l_GaussianPartition", "F3_8b_SpectralActionComputation", "F3_8c_NewtonsConstant"]
